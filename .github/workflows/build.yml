name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Dummy Keystore & Build APK
        run: |
          # 尋找包含 build.gradle.kts 的專案根目錄
          PROJECT_DIR=$(find . -maxdepth 3 -name "build.gradle.kts" -type f | grep -v "/app/" | head -n 1 | xargs dirname)
          echo "專案根目錄：$PROJECT_DIR"
          cd "$PROJECT_DIR"
          # 1. 補齊 .env 設定檔
          if [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          # 2. 生成 debug.keystore
          keytool -genkey -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          # 3. 同時放一份到 app 資料夾（確保 Gradle 讀得到）
          if [ -d "app" ]; then
            cp debug.keystore app/debug.keystore
          fi
          # 4. 執行編譯打包
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
